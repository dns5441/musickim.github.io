<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 8개 뽑기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px}.grid{width:min(95vw,1200px);display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}.image-box{aspect-ratio:4/3;background:white;border:1px solid #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:contain;display:block}button{border:none;border-radius:10px;background:#222;color:white;font-size:20px;font-weight:600;padding:14px 34px;cursor:pointer}button:hover{background:#444}button:active{transform:scale(.98)}.hint{margin-top:10px;color:#888;font-size:13px}@media(max-width:700px){.grid{gap:8px}.image-box{border-radius:6px}}
</style>
</head>
<body>
<div class="grid">
<div class="image-box"><img class="random-image" src="Images/1.png"></div><div class="image-box"><img class="random-image" src="Images/2.png"></div><div class="image-box"><img class="random-image" src="Images/3.png"></div><div class="image-box"><img class="random-image" src="Images/4.png"></div>
<div class="image-box"><img class="random-image" src="Images/5.png"></div><div class="image-box"><img class="random-image" src="Images/6.png"></div><div class="image-box"><img class="random-image" src="Images/7.png"></div><div class="image-box"><img class="random-image" src="Images/8.png"></div>
</div>
<button id="drawButton">랜덤 뽑기</button><div class="hint">스페이스바를 눌러도 뽑을 수 있습니다.</div>
<script>
const images=Array.from({length:16},(_,i)=>i+1);const els=document.querySelectorAll('.random-image');
function drawRandom(){const a=[...images].sort(()=>Math.random()-.5).slice(0,8);els.forEach((e,i)=>e.src='Images/'+a[i]+'.png')}
drawButton.addEventListener('click',drawRandom);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drawRandom()}});
</script>
</body></html>
